name: Build Arabic — All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (tar + deb) — Ubuntu/Debian
    # Use glibc 2.35 so the DEB also runs on Debian 12 and Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone the pinned language data and apply Arabic patch
        env:
          CRAFT_I18N_DIR: /tmp/craft-i18n
        run: |
          revision="$(tr -d '\r\n' < craft-i18n.rev)"
          if [[ ! "$revision" =~ ^[[:xdigit:]]{40}$ ]]; then echo 'Invalid craft-i18n revision' >&2; exit 1; fi
          git init "$CRAFT_I18N_DIR"
          git -C "$CRAFT_I18N_DIR" remote add origin https://github.com/storytold/craft-i18n
          git -C "$CRAFT_I18N_DIR" fetch --depth=1 origin "$revision"
          git -C "$CRAFT_I18N_DIR" checkout --detach FETCH_HEAD
          python3 arabization-en/apply_patch.py
          echo "CRAFT_I18N_DIR=$CRAFT_I18N_DIR" >> "$GITHUB_ENV"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install pinned nFPM
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nfpm.tar.gz" \
            'https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz'
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm-bin" nfpm
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"

      - name: Build Linux tar + deb
        env:
          CRAFT_I18N_DIR: /tmp/craft-i18n
          CRAFT_I18N_REQUIRED: '1'
        run: |
          bash packaging/linux/package.sh --formats "tar deb"
          ls -lh dist/release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wordcraft-arabic-linux
          path: |
            dist/release/*.tar.gz
            dist/release/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows (MSI + Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clone craft-i18n + apply Arabic patch
        shell: bash
        run: |
          git clone https://github.com/storytold/craft-i18n "C:/temp/craft-i18n"
          test -f arabization-en/04-Translation-Patch.tsv
          test -s "C:/temp/craft-i18n/locales/ar/wordcraft.tsv"
          test -s "C:/temp/craft-i18n/locales/ar/common.tsv"
          if [ -f arabization-en/04-Translation-Patch.tsv ]; then
            python << 'PYEOF'
          import pathlib
          patch_path = pathlib.Path("arabization-en/04-Translation-Patch.tsv")
          craft_root = pathlib.Path("C:/temp/craft-i18n/locales/ar") if pathlib.Path("C:/temp/craft-i18n").exists() else pathlib.Path("/tmp/craft-i18n/locales/ar")
          patch_entries=[]
          for line in patch_path.read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.lstrip().startswith("#"): continue
              parts=line.split("\t")
              if len(parts)==3: ctx,eng,new=parts
              elif len(parts)==2: ctx=""; eng,new=parts
              else: continue
              ctx=ctx.strip(); eng=eng.strip(); new=new.strip()
              if eng and new: patch_entries.append((ctx,eng,new))
          patch_dict={(ctx,eng):new for ctx,eng,new in patch_entries}
          for fname in ["common.tsv","wordcraft.tsv","pdfcraft.tsv","cadcraft.tsv"]:
              fpath=craft_root/fname
              if not fpath.exists(): continue
              lines=fpath.read_text(encoding="utf-8").splitlines()
              out=[]; upd=0
              for line in lines:
                  if line.startswith("#") or not line.strip(): out.append(line); continue
                  parts=line.split("\t")
                  if len(parts)<3: out.append(line); continue
                  if len(parts)>3: ctx=parts[0]; eng=parts[1]; trans="\t".join(parts[2:])
                  else: ctx,eng,trans=parts
                  key=(ctx,eng)
                  if key in patch_dict:
                      trans=patch_dict[key]; upd+=1
                      out.append(f"{ctx}\t{eng}\t{trans}")
                  else: out.append(line)
              fpath.write_text("\n".join(out)+"\n", encoding="utf-8")
              print(f"{fname}: {upd} updated")
          PYEOF
          fi
          echo "CRAFT_I18N_DIR=C:/temp/craft-i18n" >> "$GITHUB_ENV"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install WiX 5.0.2 and matching extensions
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'wordcraft-wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
          $wix = Join-Path $tools 'wix.exe'
          & $wix --version
          if ($LASTEXITCODE -ne 0) { throw 'WiX version check failed.' }
          foreach ($extension in @('UI', 'Util')) {
            & $wix extension add -g "WixToolset.$extension.wixext/5.0.2"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension $extension installation failed." }
          }

      - name: Validate MSI packaging before compiling the app
        shell: pwsh
        run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wordcraft-wix-check') -Architectures x64

      - name: Build Windows MSI + Portable
        shell: pwsh
        env:
          CRAFT_I18N_DIR: C:/temp/craft-i18n
          CRAFT_I18N_REQUIRED: '1'
        run: |
          $catalog = Join-Path $env:CRAFT_I18N_DIR 'locales/ar/wordcraft.tsv'
          if (-not (Test-Path -LiteralPath $catalog -PathType Leaf)) { throw 'Arabic WordCraft catalog is missing.' }
          ./packaging/windows/package.ps1 -Arch x64
          $msi = @(Get-ChildItem -Path dist/release -Filter '*.msi' -File)
          if ($msi.Count -ne 1 -or $msi[0].Length -lt 1MB) { throw 'Expected one nonempty WordCraft MSI in dist/release.' }
          $msi | Format-Table Name, Length

      - name: Verify Arabic translation is embedded
        shell: bash
        run: |
          python <<'PYEOF'
          from pathlib import Path
          rows = Path('arabization-en/04-Translation-Patch.tsv').read_bytes().splitlines()
          home = next(row.split(b'\t')[2] for row in rows if row.startswith(b'\tHome\t'))
          assert home in Path('C:/temp/craft-i18n/locales/ar/common.tsv').read_bytes(), 'Arabic patch not applied'
          assert home in Path('target/windows-package/x64/wordcraft.exe').read_bytes(), 'Arabic translation not embedded'
          print('Verified: Arabic translation is embedded in wordcraft.exe')
          PYEOF

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wordcraft-arabic-windows
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Display artifacts
        run: ls -R artifacts
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
